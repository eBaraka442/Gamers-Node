<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamers-Node Chatbot</title>
  <link rel="stylesheet" href="bot.css">
</head>
<body>

  <button id="gn-chat-toggle" type="button">
    🎮 Chat with us
  </button>

  <section id="gn-chat" aria-label="Gamers-Node chatbot">
    <div class="gn-chat-header">
      <span>💜 Gamers-Node Bot</span>
      <button id="gn-chat-close" type="button" aria-label="Close chat">×</button>
    </div>

    <div id="gn-chat-messages" aria-live="polite">
      <div class="gn-message gn-bot-message">
        Hey gamer! 🎮 Welcome to Gamers-Node. Ask me about joining, games, or tournaments!
      </div>
    </div>

    <form id="gn-chat-form">
      <input
        id="gn-chat-input"
        type="text"
        placeholder="Ask me something..."
        maxlength="300"
        autocomplete="off"
        required
      >
      <button type="submit">Send</button>
    </form>
  </section>

  <script src="bot.js"></script>
</body>
</html>

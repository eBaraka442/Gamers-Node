<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're In! | Gamers-Node</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top, #32105e 0%, #100819 45%, #050507 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 650px;
      padding: 48px 28px;
      border: 1px solid #9b4dff;
      border-radius: 22px;
      background: rgba(17, 10, 29, 0.92);
      box-shadow: 0 0 30px rgba(153, 50, 255, 0.25);
    }

    .logo {
      color: #c084fc;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }

    .icon {
      font-size: 62px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px #a855f7);
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 18px;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(168, 85, 247, 0.7);
    }

    h1 span {
      color: #c084fc;
    }

    p {
      color: #c9c2d5;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 9px;
      background: #9333ea;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(147, 51, 234, 0.4);
      transition: 0.2s ease;
    }

    .button:hover {
      background: #a855f7;
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(168, 85, 247, 0.7);
    }

    .small {
      font-size: 13px;
      color: #8f849e;
      margin-top: 30px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🎮 GAMERS-NODE</div>

    <div class="icon">✓</div>

    <h1>YOU'RE IN, <span>GAMER!</span></h1>

    <p>
      Welcome to Gamers-Node! Your registration has been
      submitted. Thanks for joining our gaming community.
      Get ready to connect, explore games, and level up
      together!
    </p>

    <a class="button" href="./index.html">
      BACK TO HOMEPAGE
    </a>

    <p class="small">
      GAME TOGETHER. LEVEL UP TOGETHER.
    </p>
  </main>
</body>
</html>

<!-- SUPABASE PUBLIC DATA -->
<script>

const PUBLIC_SUPABASE_URL =
    "https://zptxyfqqgxnxktquvkrk.supabase.co";

const PUBLIC_SUPABASE_KEY =
    "sb_publishable_HdzQx4LPbKeB4ZU671Xw8A_bk8_mVbP";

const publicDB = window.supabase.createClient(
    PUBLIC_SUPABASE_URL,
    PUBLIC_SUPABASE_KEY
);

// ==========================================
// HELPER FUNCTIONS
// ==========================================

function escapePlayerName(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function publicFormatDate(value) {
    if (!value) return "—";

    const date = new Date(value);

    return Number.isNaN(date.getTime())
        ? "—"
        : date.toLocaleDateString();
}

function showPublicError(table, message, columns) {
    table.innerHTML = `
        <tr>
            <td colspan="${columns}" class="public-empty">
                ${message}
            </td>
        </tr>
    `;
}

// ==========================================
// REGISTERED PLAYERS
// ==========================================

async function loadPublicPlayers() {

    const container =
        document.getElementById("publicPlayers");

    try {

        const { data, error } = await publicDB
            .from("players")
            .select("display_name, is_active, created_at")
            .eq("is_active", true)
            .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {

            container.innerHTML = `
                <article class="card">
                    <p>No registered players yet.</p>
                </article>
            `;

            return;
        }

        container.innerHTML = data.map(player => `
            <article class="card">
                <div class="emoji">🎮</div>
                <h3>${escapePlayerName(player.display_name)}</h3>
                <p>Gamers-Node Member</p>
            </article>
        `).join("");

    } catch (error) {

        console.error("Players error:", error);

        container.innerHTML = `
            <article class="card">
                <p>Unable to load players right now.</p>
            </article>
        `;
    }
}

// ==========================================
// TOURNAMENTS
// ==========================================

async function loadPublicTournaments() {

    const table =
        document.getElementById("publicTournaments");

    try {

        const { data, error } = await publicDB
            .from("tournaments")
            .select("name, season, status, start_date, created_at")
            .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {

            showPublicError(
                table,
                "No tournaments available yet.",
                4
            );

            return;
        }

        table.innerHTML = data.map(tournament => `
            <tr>
                <td>${escapePlayerName(tournament.name)}</td>
                <td>${escapePlayerName(tournament.season || "—")}</td>
                <td class="public-status">
                    ${escapePlayerName(tournament.status || "—")}
                </td>
                <td>${publicFormatDate(tournament.start_date)}</td>
            </tr>
        `).join("");

    } catch (error) {

        console.error("Tournament error:", error);

        showPublicError(
            table,
            "Unable to load tournaments.",
            4
        );
    }
}

// ==========================================
// LEAGUE STANDINGS
// ==========================================

async function loadPublicStandings() {

    const table =
        document.getElementById("publicStandings");

    try {

        const { data, error } = await publicDB
            .from("league_standings")
            .select("*")
            .order("tournament_name")
            .order("pts", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {

            showPublicError(
                table,
                "No assigned standings available yet.",
                6
            );

            return;
        }

        const groups = {};

        data.forEach(player => {

            const tournament =
                player.tournament_name || "Tournament";

            if (!groups[tournament]) {
                groups[tournament] = [];
            }

            groups[tournament].push(player);

        });

        Object.values(groups).forEach(players => {

            players.sort((a, b) =>
                (Number(b.pts) || 0) -
                (Number(a.pts) || 0) ||

                (Number(b.w) || 0) -
                (Number(a.w) || 0)
            );

        });

        table.innerHTML = Object.entries(groups).map(
            ([tournament, players]) => {

                const heading = `
                    <tr>
                        <td colspan="6" style="
                            background:#1b1030;
                            color:#d8b4fe;
                            font-size:18px;
                            font-weight:bold;
                            padding:15px;
                            text-align:left;
                            border-top:2px solid #8b5cf6;
                        ">
                            🏆 ${escapePlayerName(tournament)}
                        </td>
                    </tr>
                `;

                const rows = players.map(player => `
                    <tr>
                        <td>
                            ${escapePlayerName(player.player_name)}
                        </td>
                        <td>${player.mp ?? 0}</td>
                        <td>${player.w ?? 0}</td>
                        <td>${player.d ?? 0}</td>
                        <td>${player.l ?? 0}</td>
                        <td>${player.pts ?? 0}</td>
                    </tr>
                `).join("");

                return heading + rows;

            }
        ).join("");

    } catch (error) {

        console.error("Standings error:", error);

        showPublicError(
            table,
            "Unable to load standings.",
            6
        );
    }
}

// ==========================================
// LOAD ALL PUBLIC DATA
// ==========================================

async function loadPublicData() {

    await Promise.allSettled([
        loadPublicPlayers(),
        loadPublicTournaments(),
        loadPublicStandings()
    ]);

}

loadPublicData();

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Gamers-Node</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090711;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    background: #171126;
    border: 1px solid #39205c;
    border-radius: 15px;
    padding: 35px;
    width: 100%;
    max-width: 420px;
    text-align: center;
}

h1 {
    color: #c084fc;
    margin-bottom: 15px;
}

p {
    color: #c4b5d8;
    margin-bottom: 25px;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    background: #090711;
    border: 1px solid #553477;
    border-radius: 8px;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #8b5cf6;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #a78bfa;
}

#message {
    margin-top: 20px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

a {
    color: #c084fc;
    text-decoration: none;
}
</style>
</head>

<body>
<div class="container">
    <h1>Reset Password</h1>
    <p>Enter your new password below to regain access to your Gamers-Node admin account.</p>

    <form id="resetForm">
        <input type="password" id="newPassword"
        placeholder="New password" required minlength="8">

        <input type="password" id="confirmPassword"
        placeholder="Confirm new password" required minlength="8">

        <button type="submit">Update Password</button>
    </form>

    <div id="message"></div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const form = document.getElementById("resetForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const password = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    message.textContent = "Updating password...";

    const { error } = await supabaseClient.auth.updateUser({
        password: password
    });

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent = "Password updated successfully! You can now log in.";

    form.reset();
});
</script>

</body>
</html>
